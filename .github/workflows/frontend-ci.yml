name: Frontend CI

on:
  pull_request:
  push:
    branches:
      - main

defaults:
  run:
    working-directory: frontend

jobs:
  frontend:
    name: lint, typecheck, test, build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      - name: Build container
        run: docker build --tag aqt-health-frontend:test .

      - name: Check container startup
        run: |
          trap 'docker rm --force health-frontend-test' EXIT
          docker run --detach --name health-frontend-test \
            --health-interval 2s --health-start-period 0s --health-retries 15 \
            aqt-health-frontend:test
          for attempt in {1..30}; do
            status=$(docker inspect --format '{{.State.Health.Status}}' health-frontend-test)
            if [ "$status" = healthy ]; then
              exit 0
            fi
            if [ "$status" = unhealthy ]; then
              break
            fi
            sleep 2
          done
          docker logs health-frontend-test
          exit 1
