# Runs the images published to GHCR; docker-compose.yml stays the local
# build-from-source setup. Pin AQT_HEALTH_API_TAG / AQT_HEALTH_FRONTEND_TAG to
# sha-<commit> so updates and rollbacks are a tag edit plus `up -d`.
#
#   docker compose -f docker-compose.deploy.yml up -d
services:
  postgres:
    # No host port: only the app reaches PostgreSQL, over the compose network.
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aqt_health}
      POSTGRES_USER: ${AQT_HEALTH_DB_USER:-aqt_health}
      POSTGRES_PASSWORD: ${AQT_HEALTH_DB_PASSWORD:?set AQT_HEALTH_DB_PASSWORD in .env}
    volumes:
      - aqt_health_pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AQT_HEALTH_DB_USER:-aqt_health} -d ${POSTGRES_DB:-aqt_health}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    image: ghcr.io/aquitano/aqt-health-api:${AQT_HEALTH_API_TAG:-latest}
    # Loopback only: reach it through a reverse proxy or Tailscale.
    ports:
      - "127.0.0.1:${AQT_HEALTH_API_PORT:-8080}:8080"
    environment:
      AQT_HEALTH_ENV: ${AQT_HEALTH_ENV:-production}
      AQT_HEALTH_JDBC_URL: ${AQT_HEALTH_JDBC_URL:-jdbc:postgresql://postgres:5432/aqt_health}
      AQT_HEALTH_DB_USER: ${AQT_HEALTH_DB_USER:-aqt_health}
      AQT_HEALTH_DB_PASSWORD: ${AQT_HEALTH_DB_PASSWORD}
      AQT_HEALTH_DB_MAX_POOL_SIZE: ${AQT_HEALTH_DB_MAX_POOL_SIZE:-10}
      AQT_HEALTH_BOOTSTRAP_CLIENT_NAME: ${AQT_HEALTH_BOOTSTRAP_CLIENT_NAME:-}
      AQT_HEALTH_BOOTSTRAP_API_KEY: ${AQT_HEALTH_BOOTSTRAP_API_KEY:-}
      AQT_HEALTH_GOOGLE_CLIENT_ID: ${AQT_HEALTH_GOOGLE_CLIENT_ID:-}
      AQT_HEALTH_GOOGLE_CLIENT_SECRET: ${AQT_HEALTH_GOOGLE_CLIENT_SECRET:-}
      AQT_HEALTH_GOOGLE_REDIRECT_URI: ${AQT_HEALTH_GOOGLE_REDIRECT_URI:-}
      AQT_HEALTH_GOOGLE_TOKEN_ENCRYPTION_KEY: ${AQT_HEALTH_GOOGLE_TOKEN_ENCRYPTION_KEY:-}
      AQT_HEALTH_WITHINGS_CLIENT_ID: ${AQT_HEALTH_WITHINGS_CLIENT_ID:-}
      AQT_HEALTH_WITHINGS_CLIENT_SECRET: ${AQT_HEALTH_WITHINGS_CLIENT_SECRET:-}
      AQT_HEALTH_WITHINGS_REDIRECT_URI: ${AQT_HEALTH_WITHINGS_REDIRECT_URI:-}
      AQT_HEALTH_WITHINGS_TOKEN_ENCRYPTION_KEY: ${AQT_HEALTH_WITHINGS_TOKEN_ENCRYPTION_KEY:-}
      AQT_HEALTH_LOG_FORMAT: ${AQT_HEALTH_LOG_FORMAT:-json}
      AQT_HEALTH_CORS_ORIGINS: ${AQT_HEALTH_CORS_ORIGINS:-}
      OPENOBSERVE_URL: ${OPENOBSERVE_URL:-}
      OPENOBSERVE_ORG: ${OPENOBSERVE_ORG:-}
      OPENOBSERVE_USER: ${OPENOBSERVE_USER:-}
      OPENOBSERVE_PASSWORD: ${OPENOBSERVE_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    image: ghcr.io/aquitano/aqt-health-frontend:${AQT_HEALTH_FRONTEND_TAG:-latest}
    ports:
      - "127.0.0.1:${AQT_HEALTH_FRONTEND_PORT:-3000}:3000"
    environment:
      AQT_HEALTH_API_BASE_URL: ${AQT_HEALTH_API_BASE_URL:-http://app:8080}
      AQT_HEALTH_API_KEY: ${AQT_HEALTH_API_KEY:-}
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

volumes:
  aqt_health_pgdata:
